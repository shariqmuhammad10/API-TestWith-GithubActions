name: k6 API Performance Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  k6_local_test:
    name: Run k6 Test
    runs-on: ubuntu-latest

    steps:
      # Step 1: Pull your repository code into the runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Install the official k6 environment onto the runner
      - name: Setup Grafana k6
        uses: grafana/setup-k6-action@v1

      # Step 3: Run your test script using the modern runner action
      - name: Run k6 Local Test
        uses: grafana/run-k6-action@v1
        with:
          path: api_test.js